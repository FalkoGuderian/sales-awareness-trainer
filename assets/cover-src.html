<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ground:#f4f5f8; --ink:#171a24; --ink-2:#454b5c; --ink-3:#6d7488;
    --line:#dcdfe8; --accent:#4a3bbd; --accent-soft:#ecebfa; --surface:#ffffff;
  }
  html,body{width:1200px;height:630px}
  body{font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);
    background:var(--ground);position:relative;overflow:hidden}
  .frame{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .kicker{font-weight:700;letter-spacing:.14em;font-size:15px;color:var(--ink-3);text-transform:uppercase}
  .hl{max-width:520px;margin-top:36px}
  .hl .title{font-size:56px;line-height:1.08;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
  .hl .sub{margin-top:20px;font-size:22px;line-height:1.45;font-weight:400;color:var(--ink-2);max-width:500px}
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
  .badge{font-size:13.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px}
  .art{
    position:absolute;right:0;top:50%;width:640px;height:400px;transform:translateY(-50%);overflow:hidden;
    -webkit-mask-image:radial-gradient(ellipse 62% 58% at 60% 52%, black 45%, transparent 88%);
    mask-image:radial-gradient(ellipse 62% 58% at 60% 52%, black 45%, transparent 88%);
  }
  .art img{width:100%;height:100%;object-fit:cover;object-position:64% 50%}
</style></head>
<body>
  <div class="frame">
    <div class="top">
      <div class="dot"></div>
      <div class="kicker">Sales &middot; Training Tool</div>
    </div>

    <div class="hl">
      <div class="title">Sales Awareness<br>Trainer</div>
      <div class="sub">5 stages of awareness. One AI prospect. You don&rsquo;t know beforehand which stage you&rsquo;re facing.</div>
      <div class="badges">
        <div class="badge">Roleplay</div>
        <div class="badge">Live evaluation</div>
        <div class="badge">Voice mode</div>
        <div class="badge">No server, 100% local</div>
      </div>
    </div>
  </div>

  <div class="art"><img src="cover-art.png" alt=""></div>
</body></html>
