<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent}
  .phone{
    position:relative; width:422px; padding:16px 16px 30px; background:#15161c;
    border-radius:56px; box-shadow:0 24px 60px rgba(20,20,30,.28), 0 2px 6px rgba(20,20,30,.12);
  }
  .phone::before{
    content:""; position:absolute; inset:0; border-radius:56px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);
  }
  .screen{width:100%; border-radius:34px; overflow:hidden; background:#fff; position:relative}
  .screen img{width:100%; display:block}
  .island{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    width:100px; height:26px; background:#15161c; border-radius:16px; z-index:2;
  }
</style></head>
<body>
  <div class="phone">
    <div class="island"></div>
    <div class="screen"><img id="shot" src=""></div>
  </div>
</body></html>
